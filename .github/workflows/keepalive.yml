name: 3. Keepalive — clé API OKX

on:
  schedule:
    # Toutes les 48h environ : garde active une clé OKX non liée à une IP sans passer d'ordre.
    - cron: '0 6 */2 * *'

permissions:
  contents: read

concurrency:
  group: okx-dca-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Appel OKX authentifié sans ordre
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: |
          if [ -z "$OKX_API_KEY" ]; then echo "Secrets OKX absents — keepalive ignoré."; exit 0; fi
          node scripts/keepalive.mjs
