name: 1. Configurer mon plan

on:
  workflow_dispatch:
    inputs:
      paires:
        description: "Que voulez-vous acheter ? (ex. BTC-EUR — plusieurs séparées par des virgules, même devise)"
        required: true
        default: 'BTC-USDC'
      montant:
        description: "Montant par actif et par achat"
        required: true
        default: '50'
      intervalle:
        description: "Un achat tous les combien de jours ?"
        required: true
        default: '15'
      duree:
        description: "Pendant combien de mois ?"
        required: true
        default: '3'
      compte:
        description: "Quel compte OKX ?"
        required: true
        default: 'demo'
        type: choice
        options: [demo, reel]
      region:
        description: "Où est votre compte ?"
        required: true
        default: 'eea'
        type: choice
        options: [eea, global, us, tr]
      execution:
        description: "Transmettre les ordres ?"
        required: true
        default: 'simulation'
        type: choice
        options: [simulation, acheter]
      reset_history:
        description: "Effacer l'historique de présentation ? Interdit en compte réel et ne touche jamais au registre"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: okx-dca-state
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Vérification syntaxe et whitespace
        run: |
          for file in scripts/*.mjs tests/*.mjs; do node --check "$file"; done
          git diff --check

  configurer:
    needs: quality-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Générer le planning
        env:
          PAIRES: ${{ inputs.paires }}
          MONTANT: ${{ inputs.montant }}
          INTERVALLE: ${{ inputs.intervalle }}
          DUREE: ${{ inputs.duree }}
          COMPTE: ${{ inputs.compte }}
          REGION: ${{ inputs.region }}
          EXECUTION: ${{ inputs.execution }}
        run: |
          case "$PAIRES" in *$'\n'*|*$'\r'*) echo "Paires invalides"; exit 1;; esac
          case "$MONTANT" in *[!0-9.]*|'') echo "Montant invalide"; exit 1;; esac
          case "$INTERVALLE" in *[!0-9]*|'') echo "Intervalle invalide"; exit 1;; esac
          case "$DUREE" in *[!0-9.]*|'') echo "Durée invalide"; exit 1;; esac
          EXTRA_ARGS=(--check --force)
          if [ "$EXECUTION" = "acheter" ]; then EXTRA_ARGS+=(--live); fi
          node scripts/plan.mjs \
            --instId "$PAIRES" \
            --amount "$MONTANT" \
            --every "$INTERVALLE" \
            --months "$DUREE" \
            --account "$COMPTE" \
            --site "$REGION" \
            "${EXTRA_ARGS[@]}"

      - name: Historique conservé ou projection démo réinitialisée explicitement
        env:
          RESET_HISTORY: ${{ inputs.reset_history }}
          COMPTE: ${{ inputs.compte }}
        run: |
          if [ "$RESET_HISTORY" = "true" ]; then
            if [ "$COMPTE" = "reel" ]; then
              echo "Refus : reset_history est interdit en compte réel pour préserver l'audit."
              exit 1
            fi
            printf '{\n  "purchases": []\n}\n' > data/history.json
            echo "Historique de présentation démo réinitialisé ; data/operations.json est conservé."
          else
            if [ ! -f data/history.json ]; then
              printf '{\n  "purchases": []\n}\n' > data/history.json
              echo "Historique initial créé."
            else
              echo "Historique conservé."
            fi
          fi

      - name: Générer le tableau de bord
        run: node scripts/report.mjs

      - name: Enregistrer le plan
        run: |
          if [ -z "$(git status --porcelain data/ RAPPORT.md tableau-de-bord.html)" ]; then
            echo "Le plan est déjà à jour."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ RAPPORT.md tableau-de-bord.html
          git commit -m "Mon plan d'achats"
          git pull --rebase --autostash origin main
          git push

      - name: Récapitulatif
        env:
          EXECUTION: ${{ inputs.execution }}
        run: |
          {
            echo ""
            echo "➡️ Votre tableau de bord complet : [RAPPORT.md](../blob/main/RAPPORT.md)"
            echo ""
            if [ "$EXECUTION" = "acheter" ]; then
              echo "### ⚠️ Plan live demandé"
              echo ""
              echo "Le plan est marqué live, mais le réel ne peut partir que via le job protégé real-trading et son secret d'armement."
              echo "En démo, les ordres restent fictifs. Pour arrêter : relancez ce workflow avec \`simulation\`."
            else
              echo "### 🧪 Mode simulation"
              echo ""
              echo "Le système détecte les échéances, mais **ne transmet aucun ordre**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
