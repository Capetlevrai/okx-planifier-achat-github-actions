name: 1. Configurer mon plan

# Tout se règle ici : Actions > ce workflow > "Run workflow".
# Aucune installation, aucune page de réglages à visiter.

on:
  workflow_dispatch:
    inputs:
      paires:
        description: "Que voulez-vous acheter ? (ex. BTC-EUR — plusieurs séparées par des virgules, même devise)"
        required: true
        default: 'BTC-USDC'
      montant:
        description: "Montant par actif et par achat"
        required: true
        default: '50'
      intervalle:
        description: "Un achat tous les combien de jours ?"
        required: true
        default: '15'
      duree:
        description: "Pendant combien de mois ?"
        required: true
        default: '3'
      compte:
        description: "Quel compte OKX ?"
        required: true
        default: 'demo'
        type: choice
        options:
          - demo
          - reel
      region:
        description: "Où est votre compte ?"
        required: true
        default: 'eea'
        type: choice
        options:
          - eea
          - global
          - us
          - tr
      execution:
        description: "Transmettre les ordres ?"
        required: true
        default: 'simulation'
        type: choice
        options:
          - simulation
          - acheter

permissions:
  contents: write

jobs:
  configurer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Générer le planning
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: |
          # --check valide les paires auprès d'OKX, si les secrets sont déjà là.
          CHECK=""
          if [ -n "$OKX_API_KEY" ]; then CHECK="--check"; fi
          LIVE=""
          if [ "${{ inputs.execution }}" = "acheter" ]; then LIVE="--live"; fi
          node scripts/plan.mjs \
            --instId  "${{ inputs.paires }}" \
            --amount  "${{ inputs.montant }}" \
            --every   "${{ inputs.intervalle }}" \
            --months  "${{ inputs.duree }}" \
            --account "${{ inputs.compte }}" \
            --site    "${{ inputs.region }}" \
            $CHECK $LIVE --force

      - name: Repartir de zéro côté historique
        run: |
          printf '{\n  "purchases": []\n}\n' > data/history.json

      - name: Enregistrer le plan
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Le plan est déjà à jour."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Mon plan d'achats"
          git push

      - name: Récapitulatif
        run: |
          {
            echo "## ✅ Votre plan est enregistré"
            echo ""
            node -e '
              const p = require("./data/plan.json");
              const s = p.strategy;
              const total = p.entries.reduce((n, e) => n + e.amount, 0);
              console.log(`- **Actifs** : ${s.instIds.join(", ")}`);
              console.log(`- **Montant** : ${s.amountPerAsset} ${s.quoteCcy} par actif et par échéance`);
              console.log(`- **Rythme** : tous les ${s.everyDays} jours, ${s.cycles} fois, à ${s.hourUtc}h00 UTC`);
              console.log(`- **Période** : du ${p.entries[0].dueAt.slice(0,10)} au ${p.entries.at(-1).dueAt.slice(0,10)}`);
              console.log(`- **Total engagé** : ${total} ${s.quoteCcy}`);
              console.log(`- **Compte** : ${p.demo ? "démo (argent fictif)" : "RÉEL (argent réel)"} — ${p.baseUrl}`);
              console.log(`- **Exécution** : ${p.live ? "les ordres partiront" : "simulation, aucun ordre"}`);
            '
            echo ""
            if [ "${{ inputs.execution }}" = "acheter" ]; then
              echo "### 🚀 C'est armé"
              echo ""
              echo "Les achats partiront automatiquement à chaque échéance, ordinateur éteint compris."
              echo "Pour arrêter : relancez ce workflow avec \`simulation\`."
            else
              echo "### 🧪 Mode simulation"
              echo ""
              echo "Le système tourne et détecte les échéances, mais **ne transmet aucun ordre**."
              echo "Quand vous êtes prêt, relancez ce workflow avec \`acheter\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
