name: 1. Configurer mon plan

# Tout se fait depuis le navigateur : Actions > ce workflow > "Run workflow".
# Aucune installation, aucune ligne de commande.

on:
  workflow_dispatch:
    inputs:
      paires:
        description: "Que voulez-vous acheter ? (ex. BTC-EUR — plusieurs séparées par des virgules, même devise)"
        required: true
        default: 'BTC-EUR'
      montant:
        description: "Montant par actif et par achat (ex. 50)"
        required: true
        default: '50'
      intervalle:
        description: "Un achat tous les combien de jours ?"
        required: true
        default: '15'
      duree:
        description: "Pendant combien de mois ?"
        required: true
        default: '3'
      heure:
        description: "Heure d'exécution, en UTC (9 = 11h à Paris l'été)"
        required: true
        default: '9'

permissions:
  contents: write

jobs:
  configurer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Générer le planning
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_DEMO: ${{ vars.OKX_DEMO || '1' }}
          OKX_BASE_URL: ${{ vars.OKX_BASE_URL || 'https://my.okx.com' }}
        run: |
          # --check valide les paires auprès d'OKX, mais seulement si les
          # secrets sont déjà en place. Sinon on génère quand même le plan.
          CHECK=""
          if [ -n "$OKX_API_KEY" ]; then CHECK="--check"; fi
          node scripts/plan.mjs \
            --instId "${{ inputs.paires }}" \
            --amount "${{ inputs.montant }}" \
            --every  "${{ inputs.intervalle }}" \
            --months "${{ inputs.duree }}" \
            --hour   "${{ inputs.heure }}" \
            $CHECK --force

      - name: Repartir de zéro côté historique
        run: |
          printf '{\n  "purchases": []\n}\n' > data/history.json

      - name: Enregistrer le plan
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Le plan est déjà à jour."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Mon plan d'achats"
          git push

      - name: Récapitulatif
        run: |
          {
            echo "## ✅ Votre plan est enregistré"
            echo ""
            node -e '
              const p = require("./data/plan.json");
              const s = p.strategy;
              const total = p.entries.reduce((n, e) => n + e.amount, 0);
              console.log(`- **Actifs** : ${s.instIds.join(", ")}`);
              console.log(`- **Montant** : ${s.amountPerAsset} ${s.quoteCcy} par actif et par échéance`);
              console.log(`- **Rythme** : tous les ${s.everyDays} jours, ${s.cycles} fois, à ${s.hourUtc}h00 UTC`);
              console.log(`- **Premier achat** : ${p.entries[0].dueAt.slice(0, 10)}`);
              console.log(`- **Dernier achat** : ${p.entries.at(-1).dueAt.slice(0, 10)}`);
              console.log(`- **Total engagé** : ${total} ${s.quoteCcy}`);
            '
            echo ""
            echo "### Et maintenant ?"
            echo ""
            echo "Tant que la variable \`DRY_RUN\` vaut \`1\`, **tout est simulé** : aucun ordre ne part."
            echo ""
            echo "Pour lancer les achats pour de vrai :"
            echo "**Settings → Secrets and variables → Actions → Variables → New variable**,"
            echo "nom \`DRY_RUN\`, valeur \`0\`."
          } >> "$GITHUB_STEP_SUMMARY"
