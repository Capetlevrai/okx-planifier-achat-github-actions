name: 2. Acheter — routine automatique

# Tourne sur les serveurs GitHub : votre ordinateur peut rester éteint.
on:
  schedule:
    # Tous les jours à 09:00 UTC. Le script n'agit que sur les échéances
    # réellement atteintes dans data/plan.json — un passage à vide ne coûte rien.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Choisissez 0 pour acheter maintenant · 1 pour seulement simuler"
        required: true
        default: '1'
        type: choice
        options: ['1', '0']

# Nécessaire pour réécrire data/plan.json et data/history.json dans le dépôt.
permissions:
  contents: write

# Deux exécutions simultanées réécriraient les mêmes fichiers.
concurrency:
  group: dca
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Exécuter les achats dus
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          # Laissés vides par défaut : compte, région et armement viennent tous
          # de data/plan.json, réglé depuis le formulaire de configuration.
          # Une variable de dépôt, si elle existe, reste prioritaire.
          OKX_DEMO: ${{ vars.OKX_DEMO }}
          OKX_BASE_URL: ${{ vars.OKX_BASE_URL }}
          # ATTENTION : ne pas écrire ${{ inputs.dry_run || vars.DRY_RUN }}.
          # Les expressions GitHub castent les chaînes numériques en nombres,
          # donc '0' est FAUX et l'opérateur || l'écraserait silencieusement —
          # un dry_run=0 explicite serait ignoré. On passe les deux valeurs
          # brutes et on arbitre en bash, où '0' est une chaîne comme une autre.
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          DRY_RUN_VAR: ${{ vars.DRY_RUN }}
        run: |
          # Sur un fork fraîchement cloné, les secrets ne sont pas encore
          # renseignés : on sort proprement au lieu de faire échouer le cron.
          if [ -z "$OKX_API_KEY" ]; then
            echo "Aucun secret OKX configuré sur ce dépôt — rien à exécuter."
            echo "Ajoutez OKX_API_KEY, OKX_SECRET_KEY et OKX_PASSPHRASE dans"
            echo "Settings > Secrets and variables > Actions. Voir le README."
            exit 0
          fi

          # Priorité : saisie manuelle > variable de dépôt > champ "live" du plan.
          if   [ -n "$DRY_RUN_INPUT" ]; then export DRY_RUN="$DRY_RUN_INPUT"
          elif [ -n "$DRY_RUN_VAR" ];   then export DRY_RUN="$DRY_RUN_VAR"
          fi
          echo "DRY_RUN transmis au script : '${DRY_RUN-non defini, le plan decide}'"

          node scripts/run-due.mjs

      - name: Mettre à jour le tableau de bord
        if: always()
        run: node scripts/report.mjs

      - name: Enregistrer les résultats dans le dépôt
        # s'exécute même si un achat a échoué, pour conserver la trace
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/ RAPPORT.md tableau-de-bord.html)" ]; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ RAPPORT.md tableau-de-bord.html
          git commit -m "DCA : mise à jour du planning et de l'historique [skip ci]"
          git push
