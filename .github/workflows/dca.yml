name: 2. Acheter — routine automatique

on:
  schedule:
    # Cadence horaire : respecte retryDelayMinutes=60 ; le script n'agit que si une échéance est due.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Choisissez 0 pour acheter maintenant · 1 pour seulement simuler"
        required: true
        default: '1'
        type: choice
        options: ['1', '0']

permissions:
  contents: write

concurrency:
  group: okx-dca-state
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Vérification syntaxe Node
        run: |
          for file in scripts/*.mjs tests/*.mjs; do node --check "$file"; done
      - name: Vérification whitespace git
        run: git diff --check
      - name: Shellcheck workflow snippets
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python3 - <<'PY' > /tmp/dca-shell.sh
          from pathlib import Path
          text = Path('.github/workflows/dca.yml').read_text()
          blocks = []
          in_run = False
          buf = []
          for line in text.splitlines():
              if line.strip() == 'run: |':
                  in_run = True; buf=[]; continue
              if in_run and (line.startswith('      ') or line.strip() == ''):
                  buf.append(line[10:] if line.startswith('          ') else line.lstrip())
              elif in_run:
                  blocks.append('\n'.join(buf)); in_run=False
          if in_run: blocks.append('\n'.join(buf))
          print('\n\n'.join(blocks))
          PY
          shellcheck /tmp/dca-shell.sh

  execute:
    needs: quality-gate
    runs-on: ubuntu-latest
    environment: real-trading
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Exécuter les achats dus
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_DEMO: ${{ vars.OKX_DEMO }}
          OKX_BASE_URL: ${{ vars.OKX_BASE_URL }}
          ALLOW_REAL_TRADING: ${{ secrets.ALLOW_REAL_TRADING }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          DRY_RUN_VAR: ${{ vars.DRY_RUN }}
        run: |
          if [ -z "$OKX_API_KEY" ]; then
            echo "Aucun secret OKX configuré sur ce dépôt — rien à exécuter."
            exit 0
          fi
          if   [ -n "$DRY_RUN_INPUT" ]; then export DRY_RUN="$DRY_RUN_INPUT"
          elif [ -n "$DRY_RUN_VAR" ];   then export DRY_RUN="$DRY_RUN_VAR"
          fi
          echo "DRY_RUN transmis au script : '${DRY_RUN-non defini, le plan decide}'"
          node scripts/run-due.mjs

      - name: Mettre à jour le tableau de bord
        if: always()
        run: node scripts/report.mjs

      - name: Enregistrer les résultats dans le dépôt
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/ RAPPORT.md tableau-de-bord.html)" ]; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ RAPPORT.md tableau-de-bord.html
          git commit -m "DCA : mise à jour du planning, registre et historique [skip ci]"
          git pull --rebase --autostash origin main
          git push
