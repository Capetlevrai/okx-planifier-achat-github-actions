name: 4. 📊 TABLEAU DE BORD — Mettre à jour l'affichage

on:
  push:
    branches: [main]
    paths: ['site/**', 'data/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois ; les pushs suivants remplacent celui en attente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Sur dépôt privé Free, GitHub Pages n'est souvent pas disponible.
  # Le DCA et le keepalive n'en dépendent pas : utilisez RAPPORT.md.
  # Pour forcer un déploiement Pages privé (compte Pro/Team) :
  # Settings → Variables → Actions → ENABLE_PRIVATE_PAGES = true
  build:
    if: ${{ !github.event.repository.private || vars.ENABLE_PRIVATE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Assembler le site
        # L'interface et ses données doivent être côte à côte une fois publiées.
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data
          # Empêche Jekyll d'ignorer les fichiers commençant par un underscore.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ !github.event.repository.private || vars.ENABLE_PRIVATE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  private-dashboard-hint:
    if: ${{ github.event.repository.private && vars.ENABLE_PRIVATE_PAGES != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Tableau de bord sans Pages (dépôt privé)
        run: |
          echo "Dépôt privé : GitHub Pages n'est pas déployé (normal sur Free)."
          echo "Consultez RAPPORT.md et tableau-de-bord.html dans le dépôt."
          echo "Les workflows DCA / keepalive / CI fonctionnent sans Pages."
          echo "docs/REPO_PRIVE.md explique le parcours complet."
