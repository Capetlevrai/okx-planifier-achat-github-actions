name: Interface — déploiement GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'data/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les pushs suivants remplacent celui en attente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le site
        # L'interface et ses données doivent être côte à côte une fois publiées.
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data
          # Empêche Jekyll d'ignorer les fichiers commençant par un underscore.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
