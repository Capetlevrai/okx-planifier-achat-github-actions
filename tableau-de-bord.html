<title>OKX DCA — tableau de bord</title>
<meta name="description" content="Tableau de bord d’un plan d’achat programmé sur OKX.">
<style>
:root{--bg:#f7f7f4;--card:#fff;--text:#111;--muted:#6b6b70;--line:#e5e2dc;--accent:#214cff;--ok:#16803d;--warn:#b45309;--bad:#c0262d}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45} .wrap{max-width:920px;margin:0 auto;padding:24px} header{padding:34px 0 20px} h1{font-size:clamp(28px,5vw,46px);line-height:1;margin:0 0 12px;letter-spacing:-.04em} h2{font-size:18px;margin:0 0 14px}.lead{color:var(--muted);max-width:680px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:18px}}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}.value{display:block;font-size:28px;font-weight:750;letter-spacing:-.03em;margin-top:8px}.sub{font-size:13px;color:var(--muted);margin-top:6px}.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 11px;font-size:13px}.pill b{color:var(--accent)}.bar{height:10px;background:#ece9e2;border-radius:999px;overflow:hidden;margin-top:14px}.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}.section{margin-top:18px}.asset{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.asset strong{font-size:24px}.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}#done-table,#todo-table{overflow-x:auto;-webkit-overflow-scrolling:touch}.table{width:100%;min-width:560px;border-collapse:collapse;font-size:14px}.table th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em;padding:10px;border-bottom:1px solid var(--line)}.table td{padding:12px 10px;border-bottom:1px solid var(--line)}.right{text-align:right}.status{font-weight:700}.done{color:var(--ok)}.pending{color:var(--muted)}.failed{color:var(--bad)}.next{color:var(--accent)}.notice{border-left:4px solid var(--accent);background:#eef2ff;padding:14px 16px;border-radius:12px;margin-top:18px;color:#1e2a55}.small{font-size:13px;color:var(--muted)}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}footer{margin-top:32px;padding-top:18px;border-top:1px solid var(--line)}@media(max-width:520px){.asset{grid-template-columns:1fr}.asset .right{text-align:left}.card{padding:15px}.table{min-width:520px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 id="page-title">Plan d’achat OKX</h1>
  <p class="lead" id="page-lead">Chargement du plan…</p>
  <div class="pillrow" id="mode"></div>
</header>

<div class="grid">
  <div class="card"><div class="label">Investi</div><span class="value mono" id="invested">—</span><div class="sub" id="planned">—</div></div>
  <div class="card"><div class="label">Achats faits</div><span class="value mono" id="done-count">—</span><div class="sub" id="remaining">—</div></div>
  <div class="card"><div class="label">Prochain achat</div><span class="value mono" id="next-date">—</span><div class="sub" id="next-sub">—</div></div>
</div>

<div class="card section">
  <h2>Progression</h2>
  <div class="small mono" id="progress-label">—</div>
  <div class="bar"><i id="progress-bar" style="width:0%"></i></div>
</div>

<div class="section" id="assets"></div>

<div class="card section">
  <h2>Achats effectués</h2>
  <div id="done-table"></div>
</div>

<div class="card section">
  <h2>À venir ou à traiter</h2>
  <div id="todo-table"></div>
</div>

<div class="notice" id="account-notice">
  Chargement du mode de compte…
</div>

<footer class="small">
  Projet : <a href="https://github.com/Capetlevrai/okx-planifier-achat-github-actions">okx-planifier-achat-github-actions</a> · Ceci n’est pas un conseil financier.
</footer>
</div>

<script>window.__DCA__ = {"plan":{"createdAt":"2026-08-07T21:49:01.552484Z","updatedAt":"2026-08-08T04:06:12.027Z","live":true,"demo":true,"site":"eea","baseUrl":"https://my.okx.com","strategy":{"label":"50 USDC par actif tous les 15 jours — BTC + ETH (démo OKX)","instIds":["BTC-USDC","ETH-USDC"],"quoteCcy":"USDC","amountPerAsset":50,"everyDays":15,"cycles":6,"hourUtc":9},"entries":[{"id":"dca-1-BTC-USDC","dueAt":"2026-08-07T09:00:00Z","instId":"BTC-USDC","amount":50,"status":"done","executedAt":"2026-08-07T21:41:40.756Z","ordId":"3813008182231564288","attempts":0,"operationId":"op_db1d5a96829e9e237482cb25","clOrdId":"dca61e35721d04513ea553f7ca3","reconciliationAttempts":0,"preflightFailures":0,"retryable":false,"filledQty":0.00077525,"avgPrice":64495.11099645276},{"id":"dca-1-ETH-USDC","dueAt":"2026-08-07T09:00:00Z","instId":"ETH-USDC","amount":50,"status":"done","executedAt":"2026-08-07T21:49:08.796Z","ordId":"3813023216194158592","attempts":0,"operationId":"op_a732812feb870985df104fc7","clOrdId":"dcab8d9978b2bb1b172ba18a724","reconciliationAttempts":0,"preflightFailures":0,"retryable":false,"filledQty":0.026045,"avgPrice":1919.700940679593},{"id":"dca-2-BTC-USDC","dueAt":"2026-08-22T09:00:00Z","instId":"BTC-USDC","amount":50,"status":"pending","attempts":0,"operationId":"op_99ea98595ab682b0cb793d16","clOrdId":"dca2725541698b46b6865edd006","reconciliationAttempts":0,"preflightFailures":0},{"id":"dca-2-ETH-USDC","dueAt":"2026-08-22T09:00:00Z","instId":"ETH-USDC","amount":50,"status":"pending","attempts":0,"operationId":"op_e193947869acd43c6840feb9","clOrdId":"dca972b516325e0c81f99ab8849","reconciliationAttempts":0,"preflightFailures":0},{"id":"dca-3-BTC-USDC","dueAt":"2026-09-06T09:00:00Z","instId":"BTC-USDC","amount":50,"status":"pending","attempts":0,"operationId":"op_d1ebc09d86265ccacf55e0b4","clOrdId":"dca00e1b3842822e7f33279b8ec","reconciliationAttempts":0,"preflightFailures":0},{"id":"dca-3-ETH-USDC","dueAt":"2026-09-06T09:00:00Z","instId":"ETH-USDC","amount":50,"status":"pending","attempts":0,"operationId":"op_80d5bd0ca2851e5f7ff35d99","clOrdId":"dca3a8a8246cacae4ff554f5fe8","reconciliationAttempts":0,"preflightFailures":0},{"id":"dca-4-BTC-USDC","dueAt":"2026-09-21T09:00:00Z","instId":"BTC-USDC","amount":50,"status":"pending","attempts":0,"operationId":"op_163613ef5e253d9b50f261e7","clOrdId":"dca408a23f43e4484db3aeb0610","reconciliationAttempts":0,"preflightFailures":0},{"id":"dca-4-ETH-USDC","dueAt":"2026-09-21T09:00:00Z","instId":"ETH-USDC","amount":50,"status":"pending","attempts":0,"operationId":"op_e788b6e8b7d3def236862227","clOrdId":"dca4dfbc4e357dc108d2ac4bcce","reconciliationAttempts":0,"preflightFailures":0},{"id":"dca-5-BTC-USDC","dueAt":"2026-10-06T09:00:00Z","instId":"BTC-USDC","amount":50,"status":"pending","attempts":0,"operationId":"op_2db84f4dd023fdcc537d4191","clOrdId":"dca48237dbc88f7942a01664c5b","reconciliationAttempts":0,"preflightFailures":0},{"id":"dca-5-ETH-USDC","dueAt":"2026-10-06T09:00:00Z","instId":"ETH-USDC","amount":50,"status":"pending","attempts":0,"operationId":"op_2c44b511cfd2566215730be6","clOrdId":"dca0ff3ef0c0e7466919d5638a5","reconciliationAttempts":0,"preflightFailures":0},{"id":"dca-6-BTC-USDC","dueAt":"2026-10-21T09:00:00Z","instId":"BTC-USDC","amount":50,"status":"pending","attempts":0,"operationId":"op_abfde4646906c893b293523a","clOrdId":"dca51aed8739812423d234d747c","reconciliationAttempts":0,"preflightFailures":0},{"id":"dca-6-ETH-USDC","dueAt":"2026-10-21T09:00:00Z","instId":"ETH-USDC","amount":50,"status":"pending","attempts":0,"operationId":"op_307c4848c3a4d354b03b2f69","clOrdId":"dcaca8fdd03eeeceb062939c5ce","reconciliationAttempts":0,"preflightFailures":0}],"risk":{"allowedInstIds":["BTC-USDC","ETH-USDC"],"maxOrderAmount":50,"maxDailyQuoteAmount":100,"maxAttempts":3,"retryDelayMinutes":60,"orderPollAttempts":10,"orderPollDelayMs":1500,"maxPlanQuoteAmount":600,"maxLifetimeQuoteAmount":600}},"history":{"purchases":[{"id":"dca-1-BTC-USDC","executedAt":"2026-08-07T21:41:40.756Z","instId":"BTC-USDC","baseCcy":"BTC","quoteCcy":"USDC","amount":50,"filledQty":0.00077525,"avgPrice":64495.11099645276,"fee":-7.7525e-7,"feeCcy":"BTC","ordId":"3813008182231564288","demo":true,"source":"schedule","operationId":"op_db1d5a96829e9e237482cb25","clOrdId":"dca61e35721d04513ea553f7ca3","status":"filled","requestedQuoteAmount":50,"executedQuoteAmount":50},{"id":"dca-1-ETH-USDC","executedAt":"2026-08-07T21:49:08.796Z","instId":"ETH-USDC","baseCcy":"ETH","quoteCcy":"USDC","amount":50,"filledQty":0.026045,"avgPrice":1919.700940679593,"fee":-0.000026045,"feeCcy":"ETH","ordId":"3813023216194158592","demo":true,"source":"schedule","operationId":"op_a732812feb870985df104fc7","clOrdId":"dcab8d9978b2bb1b172ba18a724","status":"filled","requestedQuoteAmount":50,"executedQuoteAmount":50}],"updatedAt":"2026-08-08T04:06:12.027Z"},"instruments":{"instruments":[],"byQuote":{}}};</script>
<script type="module">
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(v,d=2)=>new Intl.NumberFormat('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}).format(Number(v||0));
const money=(v,ccy)=>`${nf(v,2)} ${ccy}`;
const dFmt=new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
const fmt=iso=>dFmt.format(new Date(iso));
const rel=iso=>{const days=Math.round((new Date(iso)-Date.now())/86400000); if(days===0)return "aujourd’hui"; if(days===1)return 'demain'; if(days>1)return `dans ${days} jours`; if(days===-1)return 'hier'; return `il y a ${Math.abs(days)} jours`;};
async function loadJson(name,fallback){const embedded=window.__DCA__; if(embedded) return embedded[name.replace('.json','')]??fallback; for(const p of[`./data/${name}`,`../data/${name}`]){try{const r=await fetch(p,{cache:'no-store'}); if(r.ok)return await r.json()}catch{}} return fallback;}
const [plan,history]=await Promise.all([loadJson('plan.json',null),loadJson('history.json',{purchases:[]})]);
if(!plan){document.body.innerHTML='<div class="wrap"><h1>Aucun plan</h1><p>data/plan.json introuvable.</p></div>'; throw new Error('No plan');}
const quote=plan.strategy.quoteCcy || 'USDC';
const entries=plan.entries||[];
const purchases=[...(history.purchases||[])].sort((a,b)=>new Date(b.executedAt)-new Date(a.executedAt));
const done=entries.filter(e=>e.status==='done').length;
const problemStatuses=new Set(['failed','partial','reconcile_pending','canceled','rejected']);
const failed=entries.filter(e=>problemStatuses.has(e.status));
const pending=entries.filter(e=>e.status==='pending').sort((a,b)=>new Date(a.dueAt)-new Date(b.dueAt));
const planned=entries.reduce((n,e)=>n+Number(e.amount||0),0);
const invested=purchases.reduce((n,p)=>n+Number(p.executedQuoteAmount??p.amount??0),0);
const pct=entries.length?Math.round(done/entries.length*100):0;
const next=pending[0];
const nextBatch=next?pending.filter(e=>e.dueAt===next.dueAt):[];
const assets=[...new Set(entries.map(e=>e.instId.split('-')[0]))];
const demo=plan.demo!==false;
const modeName=demo?'démo':'réel';
const cadence=Number(plan.strategy.everyDays)===1?'chaque jour':`tous les ${plan.strategy.everyDays} jours`;
const explainError=value=>{const text=String(value||'');const market=text.match(/^No market data available for (.+)$/);return market?`Données de marché indisponibles pour ${esc(market[1])}`:esc(text)};
document.title=`OKX DCA ${demo?'Démo':'Réel'} — ${assets.join(' + ') || 'plan'}`;
$('page-title').textContent=`Plan d’achat OKX ${modeName}`;
$('page-lead').textContent=`${assets.join(' + ')} · ${money(plan.strategy.amountPerAsset,quote)} par actif · ${cadence}. Exécution automatisée par GitHub Actions.`;
$('account-notice').innerHTML=demo
  ? '<b>Mode actuel : compte démo OKX.</b><br>Les montants et achats affichés sont fictifs et proviennent de l’environnement OKX simulé.'
  : '<b>Attention : compte OKX réel.</b><br>Les montants affichés correspondent à de l’argent réel. Toute activation exige les garde-fous et la confirmation humaine prévus.';
$('mode').innerHTML=`<span class="pill"><b>${demo?'DÉMO':'RÉEL'}</b> ${demo?'argent fictif':'argent réel'}</span><span class="pill"><b>${plan.live?'PLAN LIVE':'SIMULATION'}</b> ${plan.live?(demo?'soumission démo autorisée':'soumission réelle sous garde-fous'):'aucun ordre transmis'}</span><span class="pill"><b>${esc(quote)}</b> devise d’achat</span>`;
$('invested').textContent=money(invested,quote); $('planned').textContent=`sur ${money(planned,quote)} programmés`;
$('done-count').textContent=String(done); $('remaining').textContent=`${pending.length} programmés · ${failed.length} à traiter`;
$('next-date').textContent=next?fmt(next.dueAt):'—'; $('next-sub').textContent=next?`${rel(next.dueAt)} · ${money(nextBatch.reduce((n,e)=>n+Number(e.amount||0),0),quote)}`:(failed.length?'attention requise':'plan terminé');
$('progress-label').textContent=`${done} / ${entries.length} achats · ${pct}%`; $('progress-bar').style.width=`${pct}%`;
$('assets').innerHTML=assets.map(asset=>{const assetEntries=entries.filter(e=>e.instId.startsWith(asset+'-'));const ps=purchases.filter(p=>(p.baseCcy||p.instId.split('-')[0])===asset);const spent=ps.reduce((n,p)=>n+Number(p.executedQuoteAmount??p.amount??0),0);const qty=ps.reduce((n,p)=>n+Number(p.filledQty||0),0);const assetDone=assetEntries.filter(e=>e.status==='done').length;const assetPending=assetEntries.filter(e=>e.status==='pending').length;const assetIssues=assetEntries.filter(e=>problemStatuses.has(e.status)).length;return `<div class="card section asset"><div><strong>${esc(asset)}</strong><div class="sub mono">${money(spent,quote)} investi · ${nf(qty,8)} ${esc(asset)} reçu</div></div><div class="right mono"><b>${assetDone}</b> exécuté${assetDone===1?'':'s'}<br><span class="sub">${assetPending} programmé${assetPending===1?'':'s'} · ${assetIssues} à traiter</span></div></div>`}).join('');
function table(rows,empty){if(!rows.length)return `<p class="small">${empty}</p>`;return `<table class="table"><thead><tr><th>Date</th><th>Actif</th><th class="right">Montant</th><th>Statut</th></tr></thead><tbody>${rows.map(r=>r).join('')}</tbody></table>`}
$('done-table').innerHTML=table(purchases.map(p=>{const st=p.status==='filled'?'Exécuté':p.status==='partial'?'Partiel':(p.status||'Audité');return `<tr><td>${fmt(p.executedAt)}<div class="small mono">${new Date(p.executedAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div></td><td><b>${esc(p.baseCcy||p.instId.split('-')[0])}</b><div class="small mono">${esc(p.instId)}</div></td><td class="right mono">${money(Number(p.executedQuoteAmount??p.amount??0),p.quoteCcy||quote)}</td><td class="status ${p.status==='partial'?'failed':'done'}">${esc(st)}</td></tr>`}),'Aucun résultat audité pour le moment.');
const future=[...pending,...failed].sort((a,b)=>new Date(a.dueAt)-new Date(b.dueAt));
$('todo-table').innerHTML=table(future.map(e=>{const label=e.status==='failed'?'Échec':e.status==='reconcile_pending'?'À réconcilier':e.status==='partial'?'Partiel':e.status==='canceled'?'Annulé':e.status==='rejected'?'Rejeté':nextBatch.includes(e)?'Prochain':'Programmé';const detail=e.error?`<div class="small">${explainError(e.error)}</div>`:'';return `<tr><td>${fmt(e.dueAt)}<div class="small mono">${rel(e.dueAt)}</div></td><td><b>${esc(e.instId.split('-')[0])}</b><div class="small mono">${esc(e.instId)}</div></td><td class="right mono">${money(e.amount,e.instId.split('-')[1])}</td><td class="status ${problemStatuses.has(e.status)?'failed':nextBatch.includes(e)?'next':'pending'}">${label}${detail}</td></tr>`}),'Plan terminé.');
</script>
</body>
</html>
